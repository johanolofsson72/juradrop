<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JuraDrop</title>
    <!-- Spec 026 — apply the saved appearance BEFORE first paint to avoid a
         light→dark flash. Mirrors src/lib/appearance.ts; the React theme
         controller takes over after mount. Default "system" follows the OS. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('juradrop-appearance') || 'system';
          var dark =
            p === 'dark' ||
            (p === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* no-op — the controller syncs after mount */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
