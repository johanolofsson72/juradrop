[package]
name = "juradrop"
version = "0.1.0"
edition = "2021"
description = "JuraDrop — local AI for Swedish law students"
authors = ["Johan Olofsson"]
license = "MIT"
repository = "https://github.com/johanolofsson72/juradrop"

[lib]
name = "juradrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
futures = "0.3"
thiserror = "1"
# F2/F3 disk-space pre-check — already in the dependency tree transitively
# via tokio; declaring it explicitly so the unsafe statvfs call is honest.
libc = "0.2"

[dev-dependencies]
# T023 — integration tests in tests/ need tauri::test::mock_builder /
# mock_context, which live behind the "test" feature.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
