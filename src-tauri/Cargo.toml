[package]
name = "juradrop"
version = "0.1.0"
edition = "2021"
description = "JuraDrop — local AI for Swedish law students"
authors = ["Johan Olofsson"]
license = "MIT"
repository = "https://github.com/johanolofsson72/juradrop"

[lib]
name = "juradrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
futures = "0.3"
thiserror = "1"
# F2/F3 disk-space pre-check — already in the dependency tree transitively
# via tokio; declaring it explicitly so the unsafe statvfs call is honest.
libc = "0.2"
# Spec 003 — .docx read + write for the Sammanfatta drop zone.
docx-rs = "0.4"
# Spec 003 — OS default-handler invocation (FR-007 / R-004).
open = "5"
# Spec 003 — CancellationToken for the cancel-in-flight feature (R-005 / US5).
tokio-util = { version = "0.7", features = ["rt"] }
# Spec 003 — UUID for DropJob.id used by cancel_summary lookup.
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# T023 — integration tests in tests/ need tauri::test::mock_builder /
# mock_context, which live behind the "test" feature.
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# T056 / T057 / T060 — mock HTTP server for client robustness tests.
# Binds to a random port; test-time only, never linked into the app.
wiremock = "0.6"
# T035 — consent persistence integration test needs an isolated dir.
tempfile = "3"
# Spec 003 — source-immutability SHA-256 check in integration tests (R-009).
sha2 = "0.10"
