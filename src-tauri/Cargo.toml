[package]
name = "juradrop"
version = "0.1.0"
edition = "2021"
description = "JuraDrop — local AI for Swedish law students"
authors = ["Johan Olofsson"]
license = "MIT"
repository = "https://github.com/johanolofsson72/juradrop"

[lib]
name = "juradrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
