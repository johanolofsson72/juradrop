# Spec 031 — JuraDrop CI workflow.
#
# Runs the same quality-gate sweep as release.yml, but on every push to main
# and every pull request — NOT only on v*.*.* release tags. This closes the
# window where main accumulated unverified commits between releases.
#
# It does NOT build, sign, notarize, or release anything — those stay
# exclusively in release.yml. No secrets are used; the only outbound traffic
# is cloning the repo and the (cached) Ollama sidecar download, which is the
# same already-permitted binary release.yml fetches (Principle I intact).

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded in-flight runs for the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: CI never writes to the repo or creates releases.
permissions:
  contents: read

jobs:
  gates:
    name: Quality gates
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artefacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # The bundled Ollama sidecar is gitignored, but tauri-build validates
      # externalBin existence at compile time — so cargo test/clippy cannot
      # even compile without it. Cache it keyed on the fetch script (which
      # pins the version + SHA), so it is downloaded once per version bump.
      - name: Cache Ollama sidecar binary
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: src-tauri/binaries
          key: ollama-sidecar-${{ runner.os }}-${{ hashFiles('scripts/fetch-ollama.sh') }}

      - name: Fetch Ollama sidecar binary
        if: steps.cache-ollama.outputs.cache-hit != 'true'
        run: bash scripts/fetch-ollama.sh

      - name: Install JS dependencies
        run: npm ci

      # ----- Quality gates (mirror release.yml; same order) -----

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest unit tests
        run: npm test -- --run

      - name: cargo fmt
        run: cd src-tauri && cargo fmt -- --check

      - name: Clippy strict
        run: cd src-tauri && cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cd src-tauri && cargo test
